# Keep GitHub Actions pinned SHAs fresh without opening NuGet noise
# (production libraries stay zero-PackageReference).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # CodeQL init/analyze/upload-sarif must run the same version.
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"
