name: C# Build with Dot Net - Windows

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore Upsilon.Apps.Passkey.Windows.slnx
      
    - name: Build Debug
      run: dotnet build Upsilon.Apps.Passkey.Windows.slnx --no-restore --configuration Debug
      
    - name: Build Release
      run: dotnet build Upsilon.Apps.Passkey.Windows.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal Upsilon.Apps.Passkey.Windows.slnx --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows
        path: TestResults/**/*.trx
        if-no-files-found: ignore


permissions:
  contents: read
  issues: write
  pull-requests: write