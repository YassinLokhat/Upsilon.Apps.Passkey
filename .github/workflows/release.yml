name: Release

# Publish a per-component GitHub Release when a version tag is pushed.
# Tags: interfaces-v*, utils-v*, core-v*, wpf-v* (legacy v* aliases to wpf).
# versions.json is the source of truth for versions, dependency ranges, and asset names.
# Uses only GitHub-owned actions plus the runner's gh CLI (no third-party release action).

on:
  push:
    tags:
      - "interfaces-v*.*.*"
      - "utils-v*.*.*"
      - "core-v*.*.*"
      - "wpf-v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025-vs2026

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Parse tag and resolve package
      id: meta
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF_NAME
        $component = $null
        $version = $null

        if ($tag -match '^(interfaces|utils|core|wpf)-v(.+)$') {
          $component = $Matches[1]
          $version = $Matches[2]
        }
        else {
          Write-Error "Tag '$tag' must look like wpf-v1.2.3 or legacy v1.2.3."
          exit 1
        }

        if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
          Write-Error "Version '$version' must look like 1.2.3 or 1.2.3-rc.1."
          exit 1
        }

        $manifest = Get-Content -LiteralPath versions.json -Raw -Encoding utf8 | ConvertFrom-Json
        $pkg = $manifest.packages.$component
        if ($null -eq $pkg) {
          Write-Error "Component '$component' is not defined in versions.json."
          exit 1
        }
        if (-not $pkg.ship) {
          Write-Error "Component '$component' is not shippable (ship=false)."
          exit 1
        }
        if ([string]$pkg.version -ne $version) {
          Write-Error "Tag version '$version' does not match versions.json $($component).version='$([string]$pkg.version)'."
          exit 1
        }

        $prerelease = if ($version -match '-') { 'true' } else { 'false' }
        "component=$component" >> $env:GITHUB_OUTPUT
        "version=$version" >> $env:GITHUB_OUTPUT
        "package_id=$([string]$pkg.id)" >> $env:GITHUB_OUTPUT
        "kind=$([string]$pkg.kind)" >> $env:GITHUB_OUTPUT
        "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

    - name: Verify versions.json sync (gate C)
      shell: pwsh
      run: ./scripts/Sync-Versions.ps1 -Check

    - name: Restore dependencies
      run: dotnet restore Upsilon.Apps.Passkey.Windows.slnx

    - name: Build Release
      run: dotnet build Upsilon.Apps.Passkey.Windows.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal Upsilon.Apps.Passkey.Windows.slnx --configuration Release

    - name: Publish package artifacts
      shell: pwsh
      run: |
        ./scripts/Sync-Versions.ps1 -PublishOnly -Package ${{ steps.meta.outputs.component }} -ArtifactsDir _artifacts

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        COMPONENT: ${{ steps.meta.outputs.component }}
        VERSION: ${{ steps.meta.outputs.version }}
        PACKAGE_ID: ${{ steps.meta.outputs.package_id }}
        KIND: ${{ steps.meta.outputs.kind }}
        PRERELEASE: ${{ steps.meta.outputs.prerelease }}
      shell: pwsh
      run: |
        $artifacts = Get-ChildItem -LiteralPath _artifacts -File
        if ($artifacts.Count -eq 0) {
          Write-Error "No artifacts were produced."
          exit 1
        }

        $notes = Get-ChildItem -LiteralPath _artifacts -Filter "*-release-notes.md" | Select-Object -First 1
        if ($null -eq $notes) {
          Write-Error "Release notes file was not produced."
          exit 1
        }

        $upload = @(
          Get-ChildItem -LiteralPath _artifacts -File |
            Where-Object {
              $_.Extension -eq ".nupkg" -or
              $_.Extension -eq ".zip" -or
              $_.Name.EndsWith(".sha256")
            }
        )
        if ($upload.Count -eq 0) {
          Write-Error "No nupkg/zip/sha256 assets found under _artifacts/."
          exit 1
        }

        $ghArgs = @(
          "release", "create", $env:TAG
        ) + @($upload.FullName) + @(
          "--title", "$env:PACKAGE_ID $env:VERSION",
          "--notes-file", $notes.FullName,
          "--generate-notes"
        )
        if ($env:PRERELEASE -eq "true") {
          $ghArgs += "--prerelease"
        }

        & gh @ghArgs

        "## Release package" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        "" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        "- Component: $env:COMPONENT" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        "- Package: $env:PACKAGE_ID" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        "- Version: $env:VERSION" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        foreach ($file in $upload) {
          "- Asset: $($file.Name)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        }
