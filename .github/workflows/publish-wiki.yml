name: Publish Wiki

on:
  push:
    branches: [master]
    paths:
      - 'Wiki/**'
      - '.github/workflows/publish-wiki.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish Wiki folder to GitHub Wiki
        env:
          # Fine-grained PAT with Contents: Read and write on this repo
          # (the wiki is a separate git remote that GITHUB_TOKEN cannot push to).
          # Injected via http.extraheader only — never embedded in the remote URL.
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${WIKI_TOKEN}" ]; then
            echo "::error::Missing secret WIKI_TOKEN. Create a fine-grained PAT with Contents: Read and write, then add it as repository secret WIKI_TOKEN."
            exit 1
          fi

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${WIKI_TOKEN}" | base64 -w 0)"
          git -c http.extraheader="${AUTH_HEADER}" clone --depth 1 \
            "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-clone
          rsync -a --delete --exclude='.git' Wiki/ wiki-clone/
          cd wiki-clone
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes."
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          git commit -m "Update Wiki from ${SHORT_SHA}"
          git -c http.extraheader="${AUTH_HEADER}" push
