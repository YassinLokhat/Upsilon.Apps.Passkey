name: CodeQL

# Static Application Security Testing (SAST) using GitHub's native CodeQL engine.
# CodeQL runs on GitHub's infrastructure and is not a package dependency of the
# project, so it is compatible with the "zero external dependency" policy.

on:
  push:
  schedule:
    # Weekly scan so newly published queries catch issues even without a push.
    - cron: '17 3 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C#)
    # Production projects including the Windows-only WPF GUI only build on
    # Windows, so we analyze there. Unit tests are omitted from this build so
    # CodeQL does not scan test code.
    runs-on: windows-2025-vs2026

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: csharp
        build-mode: manual
        config-file: ./.github/codeql/codeql-config.yml

    - name: Restore dependencies
      run: dotnet restore Upsilon.Apps.Passkey.Windows.slnx

    # Build production projects only. CodeQL traces this compilation, so
    # excluding UnitTests keeps test code out of the database
    - name: Build Release
      run: |
        dotnet sln Upsilon.Apps.Passkey.Windows.slnx remove UnitTests/UnitTests.csproj
        dotnet build Upsilon.Apps.Passkey.Windows.slnx --no-restore --configuration Release

    # With build-mode: manual, CodeQL traces the compiler and includes generated
    # output (obj/, bin/, *.g.cs). Filter the SARIF before upload instead.
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:csharp"
        output: sarif-results
        upload: failure-only

    - name: Filter SARIF (exclude build output)
      uses: advanced-security/filter-sarif@v1.1
      with:
        input: sarif-results/csharp.sarif
        output: sarif-results/csharp.sarif
        patterns: |
          -**/bin/**
          -**/obj/**
          -**/*.g.cs

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: sarif-results/csharp.sarif
        category: "/language:csharp"
