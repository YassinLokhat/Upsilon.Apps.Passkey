name: CodeQL

# Static Application Security Testing (SAST) using GitHub's native CodeQL engine.
# CodeQL runs on GitHub's infrastructure and is not a package dependency of the
# project, so it is compatible with the "zero external dependency" policy.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Weekly scan so newly published queries catch issues even without a push.
    - cron: '17 3 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (C#)
    # The full solution (including the Windows-only WPF GUI) only builds on
    # Windows, so we analyze there to cover every project.
    runs-on: windows-2025-vs2026

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        build-mode: manual
        # "security-and-quality" adds maintainability queries on top of the
        # default security-focused set.
        queries: security-and-quality

    - name: Restore dependencies
      run: dotnet restore Upsilon.Apps.Passkey.Windows.slnx

    - name: Build Release
      run: dotnet build Upsilon.Apps.Passkey.Windows.slnx --no-restore --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"
