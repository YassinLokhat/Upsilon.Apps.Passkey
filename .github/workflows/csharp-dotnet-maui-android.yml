name: C# Build with Dot Net - MAUI Android

on:
  push:
    branches: [ "master" ]
  pull_request:

concurrency:
  group: maui-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Setup JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: "17"

    - name: Install MAUI Android workload
      run: |
        dotnet workload install maui-android --skip-manifest-update

    - name: Restore dependencies
      run: dotnet restore Upsilon.Apps.Passkey.MAUI.slnx --locked-mode

    - name: NuGet vulnerability audit
      shell: pwsh
      run: |
        $output = dotnet list Upsilon.Apps.Passkey.MAUI.slnx package --vulnerable --include-transitive 2>&1 | Out-String
        $output | Tee-Object -FilePath nuget-vulnerable-maui-android.txt | Out-Host
        "## NuGet vulnerability audit (MAUI Android)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        $output | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        if ($output -match '(?i)has the following vulnerable packages') {
          Write-Error "One or more NuGet packages have known vulnerabilities."
          exit 1
        }

    # Build the MAUI project (not the solution with -f): referenced net10.0
    # libraries must keep their own TFM and must not inherit the Android TFM.
    - name: Build Debug (Android)
      run: dotnet build GUI/MAUI/Upsilon.Apps.Passkey.GUI.MAUI.csproj --no-restore --configuration Debug -f net10.0-android

    - name: Build Release (Android)
      run: dotnet build GUI/MAUI/Upsilon.Apps.Passkey.GUI.MAUI.csproj --no-restore --configuration Release -f net10.0-android

    # Signed APK/AAB: keystore lives in a protected GitHub Environment (never in-repo).
    # When ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
    # ANDROID_KEY_PASSWORD are set on environment "android-release", uncomment a
    # publish job that decodes the keystore and runs:
    #   dotnet publish … -f net10.0-android -c Release
    #     -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=… etc.

permissions:
  contents: read
  issues: write
  pull-requests: write
