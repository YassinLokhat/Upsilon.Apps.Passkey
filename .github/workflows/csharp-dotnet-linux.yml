name: C# Build with Dot Net - Linux

on:
  push:
    branches: [ "master" ]
  pull_request:

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minimum line coverage (0.0 - 1.0) required for the build to pass. Scoped to
  # Core (the WPF client is excluded). Bump this up as coverage grows to lock
  # in non-regression; the build fails if coverage drops below it.
  MINIMUM_LINE_COVERAGE: "0.90"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore Upsilon.Apps.Passkey.Linux.slnx

    # Production Core/Utils/Interfaces have zero PackageReference; this audits
    # test (and any other) NuGet graphs for known vulnerabilities (UPK-008).
    - name: NuGet vulnerability audit
      shell: pwsh
      run: |
        $output = dotnet list Upsilon.Apps.Passkey.Linux.slnx package --vulnerable --include-transitive 2>&1 | Out-String
        $output | Tee-Object -FilePath nuget-vulnerable.txt | Out-Host
        "## NuGet vulnerability audit" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        $output | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        if ($output -match '(?i)has the following vulnerable packages|vulnerable packages') {
          Write-Error "One or more NuGet packages have known vulnerabilities."
          exit 1
        }

    - name: Verify versions.json sync
      shell: pwsh
      run: ./scripts/Sync-Versions.ps1 -Check

    - name: Build Debug
      run: dotnet build Upsilon.Apps.Passkey.Linux.slnx --no-restore --configuration Debug
      
    - name: Build Release
      run: dotnet build Upsilon.Apps.Passkey.Linux.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal Upsilon.Apps.Passkey.Linux.slnx --logger "trx;LogFileName=test-results.trx" --results-directory _testResult --collect:"Code Coverage" --settings coverage.runsettings

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: test-results-windows
        path: _testResult/**/*.trx
        if-no-files-found: ignore

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: coverage-windows
        path: _testResult/**/*.cobertura.xml
        if-no-files-found: ignore

    - name: Publish coverage summary and enforce threshold
      if: always()
      shell: pwsh
      run: |
        $report = Get-ChildItem -Path _testResult -Recurse -Filter *.cobertura.xml | Select-Object -First 1
        if ($null -eq $report) {
          "No coverage report was produced." | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Write-Error "No coverage report was produced; cannot enforce the coverage threshold."
          exit 1
        }
        [xml]$coverage = Get-Content -Path $report.FullName
        $lineRate = [double]$coverage.coverage.'line-rate'
        $branchRate = [double]$coverage.coverage.'branch-rate'
        $threshold = [double]$env:MINIMUM_LINE_COVERAGE
        "## Code coverage" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        "" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        ("- Line coverage: {0:P2}" -f $lineRate) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        ("- Branch coverage: {0:P2}" -f $branchRate) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        ("- Required line coverage: {0:P2}" -f $threshold) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        if ($lineRate -lt $threshold) {
          ("- Result: FAILED (line coverage below the required threshold)") | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Write-Error ("Line coverage {0:P2} is below the required {1:P2}." -f $lineRate, $threshold)
          exit 1
        }
        "- Result: passed" | Add-Content -Path $env:GITHUB_STEP_SUMMARY


permissions:
  contents: read
  issues: write
  pull-requests: write